name: Website

on:
  pull_request:
    paths: ['site/**', 'docs/images/**', 'tools/**', 'categories.json', 'scripts/**', 'tests/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'tools/**', 'categories.json', 'scripts/**', 'tests/**', '.github/workflows/website.yml']
  workflow_run:
    workflows: [Refresh Amplifier Smart Tools manifests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main to GitHub Pages (other revisions are preview-only)
        type: boolean
        default: false
      family_owner:
        description: Owner of the overview and catalog sites (robotdad for fork previews)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Refresh bot commits do not trigger push workflows. Build current main
          # after success OR failure: a failed refresh may commit partial updates.
          # Never use artifacts or code supplied by the triggering run.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install website build dependencies
        run: python -m pip install -r site/requirements.txt
      - name: Build website
        env:
          FAMILY_OWNER: ${{ inputs.family_owner || (github.repository_owner == 'microsoft' && 'microsoft' || 'robotdad') }}
        run: python site/theme/build.py --family-owner "$FAMILY_OWNER"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && needs.build.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
